<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="newtab.css">
<script src="theme-init.js"></script>
<script type="module" src="newtab.js"></script>
</head>
<body>
<div class="page">
  <div class="wrap">

    <div id="banner" class="banner" hidden></div>

    <header class="hdr mono">
      <h1><span id="date"></span> <span class="muted">·</span> <span id="clock"></span> <span id="tz" class="muted"></span> <span class="muted">·</span> <span id="clock-sg"></span> <span class="muted">SGT</span></h1>
      <div class="hdr-right">
        <span id="hdr-weather"></span>
        <span id="hdr-counts"></span>
        <button type="button" id="theme" class="icon-btn" data-pref="dark" aria-label="Theme" title="Theme">
          <svg class="ic-auto" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"></path></svg>
          <svg class="ic-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
          <svg class="ic-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        </button>
        <button type="button" id="privacy" class="icon-btn" aria-label="Toggle privacy blur (P)" aria-pressed="false" title="Privacy blur (P)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          P
        </button>
        <button type="button" id="settings" class="icon-btn" aria-label="Settings (Options page)" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </header>

    <nav id="sites" class="sites blurrable" aria-label="Most visited sites" hidden></nav>

    <div class="markets">
      <section id="hourly" class="card hourly mono" aria-label="Weather, next 24 hours"></section>
      <section id="vwra" class="card vwra mono blurrable" aria-label="VWRA"></section>
    </div>

    <main class="panels">
      <section class="panel" aria-label="Today's schedule">
        <div class="panel-head center nowrap">
          <h2 id="sched-title">Schedule</h2>
          <div id="day-nav" class="day-nav" role="group" aria-label="Choose day" hidden>
            <button type="button" id="day-prev" aria-label="Previous day" title="Previous day (←)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
            </button>
            <button type="button" id="day-today">Today</button>
            <button type="button" id="day-next" aria-label="Next day" title="Next day (→)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
            </button>
          </div>
        </div>
        <div id="sched-next" class="sm muted blurrable" hidden></div>
        <div id="sched-body" class="blurrable"></div>
      </section>

      <section class="panel gap14" aria-label="Weather">
        <div class="panel-head center">
          <h2>Weather · Philadelphia</h2>
          <div class="seg" role="group" aria-label="Forecast range">
            <button type="button" id="view-days" aria-pressed="true">16 days</button>
            <button type="button" id="view-month" aria-pressed="false">Monthly</button>
          </div>
        </div>
        <div id="weather-body"></div>
      </section>

      <section class="panel gap14" aria-label="To-dos">
        <div class="panel-head">
          <h2>To-do</h2>
          <span id="todo-meta" class="sm muted"></span>
        </div>
        <div id="todo-body" class="blurrable"></div>
        <div id="todo-stats" class="stats mono blurrable"></div>
      </section>
    </main>

    <footer id="status" class="status mono"></footer>

  </div>
</div>
</body>
</html>
